[tmc5160 stepper_x]
cs_pin: PD5
# Software SPI Pins for SKR 3 EZ
spi_software_sclk_pin: PE14
spi_software_mosi_pin: PE13
spi_software_miso_pin: PE15

# --- Current Settings ---
# BTT EZ5160 RGB uses a 0.050 resistor.
# Changing this ensures 2.0A is actually 2.0A.
sense_resistor: 0.050
# Set to Motor's Max RMS (2.0A)
run_current: 1.500
stealthchop_threshold: 0

# --- 48V Optimization (SpreadCycle) ---
# Matched to your successful Y-axis tuning
driver_TBL: 1           # Blanking time 
driver_TOFF: 3          # Off time (Optimized for 48V stability)
driver_HSTRT: 7         # Hysteresis start
driver_HEND: 3          # Hysteresis end


