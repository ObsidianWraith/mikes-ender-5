# Ender 5 Plus revision 001 — 2026-10-30
# SKR 3 EZ / STM32H723 reported by MCU serial. Do not use old H743 build instructions.
# Install extras/e5_startup.py BEFORE loading this configuration. See README.
# User-confirmed motion limits, currents, pins, PID and input shaper retained.
[include KAMP_Settings.cfg]
[include e5_workflow.cfg]
[include TEST_SPEED.cfg]
[include macros.cfg]
[include timelapse.cfg]

[exclude_object]

[gcode_shell_command run_backup_script]
command: bash /home/andrew/klipper-backup/script.sh
timeout: 60.0
verbose: True

[gcode_arcs]
resolution: 0.1

[temperature_sensor motor_temp]
sensor_type: Generic 3950
sensor_pin: PA3
min_temp: 0
max_temp: 80
gcode_id: motor

[auto_speed]
settling_home: 1
endstop_samples: 3
accel_min: 15000.0
accel_max: 25000
accel_accu: 0.01
velocity_min: 300.0
velocity_max: 350.0
validate_iterations: 20

[respond]
default_type: echo

[z_tilt]
z_positions:
    -18, 180
    378, 180
points:
    0, 173
    320, 173
speed: 100
horizontal_move_z: 10
retries: 10
retry_tolerance: 0.02

[neopixel my_neopixel]
pin: PE6
chain_count: 15
# Positive X confirmed; exact 20 mm distance still requires measurement.

[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_8041164B5157355957202020FF12140F-if00
x_offset: 20
y_offset: 0
mesh_main_direction: x
mesh_runs: 2
contact_max_hotend_temperature: 100
home_xy_position: 165, 180
home_z_hop: 5
home_z_hop_speed: 30
home_xy_move_speed: 300
home_method: contact
home_method_when_homed: proximity
home_autocalibrate: unhomed

[resonance_tester]
accel_chip: beacon
probe_points: 150, 180, 20

[bed_mesh]
zero_reference_position: 165, 180
speed: 300
horizontal_move_z: 5
mesh_min: 20, 10
mesh_max: 330, 330
probe_count: 6,6

[stepper_x]
step_pin: PD4
dir_pin: !PD3
enable_pin: !PD6
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_max: 330
homing_speed: 100
homing_retract_dist: 5

[stepper_y]
step_pin: PA15
dir_pin: !PA8
enable_pin: !PD1
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC3
position_endstop: 0
position_max: 340
homing_speed: 50
homing_retract_dist: 5
# Original lead screws. Preserve user-working 4 mm/rev pending physical verification.

[stepper_z]
step_pin: PE2
dir_pin: !PE3
enable_pin: !PE0
endstop_pin: probe:z_virtual_endstop
microsteps: 16
rotation_distance: 4
position_min: -8
position_max: 400
homing_speed: 10.0

[stepper_z1]
step_pin: PD11
dir_pin: !PD10
enable_pin: !PD13
microsteps: 16
rotation_distance: 4

[extruder]
step_pin: PD15
dir_pin: !PD14
enable_pin: !PC7
rotation_distance: 8
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.4
filament_diameter: 1.750
heater_pin: PB3
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PA2
pressure_advance: 0.018
pressure_advance_smooth_time: 0.040
min_temp: 0
max_temp: 300
max_extrude_cross_section: 5

[heater_bed]
heater_pin: PD7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA1
min_temp: 5
max_temp: 140

[fan]
pin: PB7
max_power: 1
shutdown_speed: 0
cycle_time: 0.000033
hardware_pwm: False
kick_start_time: 0.100
off_below: 0.15

[heater_fan hotend_fan]
pin: PB6
heater: extruder
heater_temp: 50.0

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_28003C000C51323433323831-if00

[printer]
kinematics: cartesian
max_velocity: 600
max_accel: 20000
minimum_cruise_ratio: 0.5
max_z_velocity: 5
max_z_accel: 100
square_corner_velocity: 15

[board_pins]
aliases:
    EXP1_1=PC5, EXP1_3=PB1, EXP1_5=PE9,  EXP1_7=PE11, EXP1_9=<GND>,
    EXP1_2=PB0, EXP1_4=PE8, EXP1_6=PE10, EXP1_8=PE12, EXP1_10=<5V>,
    EXP2_1=PA6, EXP2_3=PE7, EXP2_5=PB2, EXP2_7=PC4,   EXP2_9=<GND>,
    EXP2_2=PA5, EXP2_4=PA4, EXP2_6=PA7, EXP2_8=<RST>, EXP2_10=<NC>

[display]
lcd_type: st7920
cs_pin: EXP1_4
sclk_pin: EXP1_5
sid_pin: EXP1_3
encoder_pins: ^EXP2_3, ^EXP2_5
click_pin: ^!EXP1_2

[output_pin beeper]
pin: EXP1_1
# X: 17HS16-2004S1, EZ5160 RGB, 48 V. Preserve proven current/chopper baseline.

[tmc5160 stepper_x]
cs_pin: PD5
spi_software_sclk_pin: PE14
spi_software_mosi_pin: PE13
spi_software_miso_pin: PE15
sense_resistor: 0.050
run_current: 1.500
stealthchop_threshold: 0
driver_TBL: 1
driver_TOFF: 3
driver_HSTRT: 7
driver_HEND: 3
# Y: 17HS24-2104D, EZ5160 RGB, 48 V. Intentional 2.5 A RMS overdrive.
# Three fan-cooled heatsinks; casing thermistor shutdown at 80 C retained.
# Chopper overrides are unvalidated recommendations; change only in a separate test.

[tmc5160 stepper_y]
cs_pin: PD0
spi_software_sclk_pin: PE14
spi_software_mosi_pin: PE13
spi_software_miso_pin: PE15
sense_resistor: 0.050
run_current: 2.500
stealthchop_threshold: 0
driver_TBL: 1
driver_TOFF: 3
driver_HSTRT: 7
driver_HEND: 3

[tmc2209 stepper_z]
uart_pin: PE1
run_current: 0.48
diag_pin:

[tmc2209 stepper_z1]
uart_pin: PD12
run_current: 0.48
diag_pin:
# 0.6 A RMS is approximately 0.85 A peak.

[tmc2209 extruder]
uart_pin: PC6
interpolate: True
run_current: 0.6

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode:
  CANCEL_PRINT

[pause_resume]

[display_status]

