# This file contains common pin mappings for the BigTreeTech SKR 3.
# To use this config, the firmware should be compiled for the
# STM32H743 with a "128KiB bootloader".

# See docs/Config_Reference.md for a description of parameters.
#[include EZABL.cfg]
[exclude_object]
[include KAMP_Settings.cfg]
[include bacon_print_start.cfg]
[include TEST_SPEED.cfg]

[include macros.cfg]
[include timelapse.cfg]
#[include PRINT_START.cfg]
#[include bed_mesh.cfg]
#[include safe_z_home.cfg]
#[include z_tilt.cfg]
#[include BED_MESH_CALIBRATE.cfg]
#[include START_PRINT.cfg]
#[include END_PRINT.cfg]
#[include verify_heater.cfg]
#[include respond.cfg]

[gcode_shell_command run_backup_script]
command: bash /home/andrew/klipper-backup/script.sh
timeout: 60.0
verbose: True

[gcode_arcs]
resolution: 0.1

[temperature_sensor motor_temp]
sensor_type: Generic 3950
# Use PA2 if plugged into TH0, or PA3 if plugged into TH1
sensor_pin: PA3 
min_temp: 0
max_temp: 80
# Optional: This allows you to see the temp in the 'M105' output or DWC/Mainsail
gcode_id: motor


[auto_speed]
#axis: diag_x, diag_y
#margin: 20
settling_home: 1
#max_missed: 1.0
endstop_samples: 3
accel_min: 15000.0
accel_max: 25000
accel_accu: 0.01
velocity_min: 300.0
velocity_max: 350.0
#velocity_accu: 0.05
#derate: 0.8
#validate_margin: Unset
#validate_inner_margin: 20.0
validate_iterations: 20
#results_dir: ~/printer_data/config

[respond]
default_type: echo

[z_tilt]
# Physical location of the Z lead screws
# (Left screw is roughly at X=-18, Right screw is roughly at X=378)
z_positions:
    -18, 180
    378, 180
# Points to probe (Choose points near the screws, but reachable by probe)
points:
    0, 173
    320, 173
speed: 100
horizontal_move_z: 10
retries: 10
retry_tolerance: 0.02


[neopixel my_neopixel]
pin: PE6
#   The pin connected to the neopixel. This parameter must be
#   provided.
chain_count: 15
#   The number of Neopixel chips that are "daisy chained" to the
#   provided pin. The default is 1 (which indicates only a single
#   Neopixel is connected to the pin).
#color_order: GRB
#   Set the pixel order required by the LED hardware (using a string
#   containing the letters R, G, B, W with W optional). Alternatively,
#   this may be a comma separated list of pixel orders - one for each
#   LED in the chain. The default is GRB.
#initial_RED: 0.0
#initial_GREEN: 0.0
#initial_BLUE: 0.0
#initial_WHITE: 0.0
#   See the "led" section for information on these parameters.


[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_E14A84665157355957202020FF120927-if00
x_offset: 20 # update with offset from nozzle on your machine
y_offset: 0 # update with offset from nozzle on your machine
mesh_main_direction: x
mesh_runs: 2
contact_max_hotend_temperature: 100 # increase to probe at print temps
home_xy_position: 141, 149 # update with your safe position
home_z_hop: 5
home_z_hop_speed: 30
home_xy_move_speed: 300
home_method: contact # use proximity for induction homing
home_method_when_homed: proximity # after initial calibration use induction
home_autocalibrate: unhomed # contact will calibrate beacon on first home

#[safe_z_home]
#home_xy_position: 107.5, 90 # update for your machine
#z_hop: 3

[resonance_tester]
accel_chip: beacon
probe_points: 150, 150, 20

[bed_mesh]
speed: 300
horizontal_move_z: 5
mesh_min: 20, 10
mesh_max: 330, 330
probe_count: 6,6

