# Ender 5 Plus revision 001. e5_startup.py must be installed in klippy/extras.
[e5_startup]

[gcode_macro PRINT_START]
description: Prepare nozzle, full Beacon calibration/mesh, guarded cleaning recovery
gcode:
    EPLUS_START {rawparams}

[delayed_gcode _EPLUS_BLINK]
gcode:
    {% if printer.e5_startup.alert %}
        {% set c = printer['neopixel my_neopixel'].color_data[0] %}
        {% if c[0] > 0.1 %}
            SET_LED LED=my_neopixel RED=0 GREEN=0 BLUE=0 WHITE=0 SYNC=0
        {% else %}
            SET_LED LED=my_neopixel RED=0.4 GREEN=0.25 BLUE=0 WHITE=0 SYNC=0
        {% endif %}
        UPDATE_DELAYED_GCODE ID=_EPLUS_BLINK DURATION=1
    {% endif %}

[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
variable_saved_temp: 0.0
variable_saved_idle: 600.0
variable_retracted: 0.0
gcode:
    {% if not printer.pause_resume.is_paused %}
        {% set flex = printer['gcode_macro _KAMP_Settings'].purge_retract|float == 0 %}
        {% set retract = 0.0 if flex else 0.5 %}
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=saved_temp VALUE={printer.extruder.target}
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=saved_idle VALUE={printer.idle_timeout.idle_timeout}
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=retracted VALUE=0
        PAUSE_BASE
        SET_IDLE_TIMEOUT TIMEOUT=3600
        {% if printer.extruder.can_extrude and retract > 0 %}
            SAVE_GCODE_STATE NAME=EPLUS_PAUSE_RETRACT
            M83
            G1 E-{retract} F300
            RESTORE_GCODE_STATE NAME=EPLUS_PAUSE_RETRACT
            SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=retracted VALUE={retract}
        {% endif %}
        _EPLUS_PARK
        M117 Paused - RESUME when ready
    {% endif %}

[gcode_macro RESUME]
rename_existing: RESUME_BASE
gcode:
    {% if printer.e5_startup.waiting %}
        EPLUS_CONTINUE
    {% elif printer.pause_resume.is_paused %}
        {% if 'xyz' not in printer.toolhead.homed_axes %}
            {action_raise_error('Position lost during pause. Cancel; do not rehome over a printed object.')}
        {% endif %}
        {% set target = printer['gcode_macro PAUSE'].saved_temp|float %}
        {% if target >= printer.configfile.settings.extruder.min_extrude_temp %}
            M109 S{target}
        {% elif not printer.extruder.can_extrude %}
            {action_raise_error('Heat nozzle to a suitable printing temperature before RESUME')}
        {% endif %}
        _EPLUS_RESUME_READY {rawparams}
    {% endif %}

[gcode_macro _EPLUS_RESUME_READY]
gcode:
    {% if not printer.extruder.can_extrude %}
        {action_raise_error('Nozzle is still too cold; remaining paused')}
    {% endif %}
    {% set retract = printer['gcode_macro PAUSE'].retracted|float %}
    {% if retract > 0 %}
        SAVE_GCODE_STATE NAME=EPLUS_UNRETRACT
        M83
        G1 E{retract} F300
        RESTORE_GCODE_STATE NAME=EPLUS_UNRETRACT
    {% endif %}
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=retracted VALUE=0
    SET_IDLE_TIMEOUT TIMEOUT={printer['gcode_macro PAUSE'].saved_idle}
    RESUME_BASE {rawparams}
    M117 Printing

[gcode_macro _EPLUS_PARK]
gcode:
    {% if 'xyz' in printer.toolhead.homed_axes %}
        {% set dz = [10.0, printer.toolhead.axis_maximum.z - printer.toolhead.position.z]|min %}
        SAVE_GCODE_STATE NAME=EPLUS_PARK
        G91
        G1 Z{[dz, 0]|max} F300
        G90
        G1 X165 Y170 F6000
        RESTORE_GCODE_STATE NAME=EPLUS_PARK
    {% endif %}

[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
gcode:
    # Heater shutdown precedes optional movement so a movement error cannot leave heaters on.
    TURN_OFF_HEATERS
    M107
    {% if not printer.e5_startup.active and printer.pause_resume.is_paused %}
        SET_IDLE_TIMEOUT TIMEOUT={printer['gcode_macro PAUSE'].saved_idle}
    {% endif %}
    EPLUS_ABORT
    HYPERLAPSE ACTION=STOP
    UPDATE_DELAYED_GCODE ID=_WAIT_TIMELAPSE_TAKE_FRAME DURATION=0
    UPDATE_DELAYED_GCODE ID=_WAIT_TIMELAPSE_RENDER DURATION=0
    SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=takingframe VALUE=False
    SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=is_paused VALUE=False
    CANCEL_PRINT_BASE
    _EPLUS_PARK
    M117 Print cancelled

[gcode_macro PRINT_END]
description: Bounded bed drop and shutdown; no endstop homing after print
gcode:
    M400
    TURN_OFF_HEATERS
    M107
    M220 S100
    {% if printer.extruder.can_extrude %}
        {% set retract = 0.0 if printer['gcode_macro _KAMP_Settings'].purge_retract|float == 0 else 0.5 %}
        SAVE_GCODE_STATE NAME=EPLUS_END
        M83
        G1 E-{retract} F300
        RESTORE_GCODE_STATE NAME=EPLUS_END
    {% endif %}
    {% if 'xyz' in printer.toolhead.homed_axes %}
        {% set dz = [20.0, printer.toolhead.axis_maximum.z - printer.toolhead.position.z]|min %}
        G91
        G1 Z{[dz, 0]|max} F300
        G90
        G1 X10 Y10 F6000
    {% endif %}
    EPLUS_ABORT
    HYPERLAPSE ACTION=STOP
    M400
    M84
    M117 Print complete
    # Timelapse rendering remains controlled by Moonraker's existing configuration.
