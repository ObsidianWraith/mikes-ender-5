# Utility macros, revision 001. Stress tests are manual commissioning tools.
[gcode_macro BACKUP_KLIPPER]
description: Run installed klipper-backup script
gcode:
    RUN_SHELL_COMMAND CMD=run_backup_script

[gcode_macro INPUT_SHAPER_Y_AXIS]
description: Measure Y resonances with Beacon
gcode:
    TEST_RESONANCES AXIS=Y

[gcode_macro INPUT_SHAPER_X_AXIS]
description: Measure X resonances with Beacon
gcode:
    TEST_RESONANCES AXIS=X

[gcode_macro RUN_ONE_TEST]
description: Exactly one auto-speed validation pattern at explicitly selected limits
gcode:
    {% set accel = params.ACCEL|default(10000)|float %}
    {% set speed = params.SPEED|default(300)|float %}
    {% if printer.print_stats.state in ['printing', 'paused'] or accel <= 0 or accel > printer.configfile.settings.printer.max_accel or speed <= 0 or speed > printer.configfile.settings.printer.max_velocity %}
        {action_raise_error('Idle printer and speed/accel within configured limits required')}
    {% endif %}
    {% set old_v = printer.toolhead.max_velocity %}
    {% set old_a = printer.toolhead.max_accel %}
    {% set old_c = printer.toolhead.minimum_cruise_ratio %}
    M109 S95
    G28
    SET_VELOCITY_LIMIT ACCEL={accel} VELOCITY={speed}
    AUTO_SPEED_VALIDATE VALIDATE_ITERATIONS=1
    SET_VELOCITY_LIMIT ACCEL={old_a} VELOCITY={old_v} MINIMUM_CRUISE_RATIO={old_c}

[gcode_macro STRESS_TEST_MULTI]
description: Explicit number of validation patterns; default 5, maximum 100
gcode:
    {% set runs = params.RUNS|default(5)|int %}
    {% if runs < 1 or runs > 100 %}
        {action_raise_error('RUNS must be between 1 and 100')}
    {% endif %}
    {% for n in range(runs) %}
        RUN_ONE_TEST ACCEL={params.ACCEL|default(10000)} SPEED={params.SPEED|default(300)}
    {% endfor %}
# If a test is interrupted, RESTART before printing to restore configured limits.
